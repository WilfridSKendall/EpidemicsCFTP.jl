site_name:        EpidemicsCFTP.jl
repo_url:         https://github.com/WilfridSKendall/EpidemicsCFTP.jl
site_description: Julia implementation of a CFTP algorithm for epidemic S-I-R trajectories conditional on observation of all removals.
site_author:      Wilfrid S Kendall
theme: readthedocs
extra_css:
    - assets/Documenter.css
extra_javascript:
    - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS_HTML  
    - assets/mathjaxhelper.js
markdown_extensions:
    - extra
    - tables 
    - fenced_code  
    - mdx_math
docs_dir: 'build'
pages: 
    - Home:         index.md
format:
  pdf:
    monofont: "Noto Sans Mono"
    mainfont: "Times New Roman"
