## YAML to be shared amongst all scripts in this directory.

## Allow {==...==} to indicate highlight, etc
## See <https://github.com/mloubout/critic-markup>
## also <https://github.com/mloubout/critic-markup#readme>.
## Setup / download using
## `quarto add mloubout/critic-markup`.
## For some reason, doesn't work with `beamer`.
filters:
  - critic-markup

## Bibligraphy style
csl:                /home/wilfrid/lib/palndoc/CSL/ima-journal-of-applied-mathematics.csl

## Allow for \(...\) and \[..\]
from: markdown+tex_math_single_backslash

## Page dimensions
papersize: a4

## Standard beamer format
format: 
    beamer:
        date-format:     "D MMMM YYYY"
        logo:            image/WarwickStatistics-small.png
        titlegraphic:    image/talk_URL.jpg
        
        number-sections: true
        number-depth:    1

        theme:           Boadilla
        mainfont:        "Times New Roman"
        monofont:        "JuliaMono"
        monofontoptions:
              - Scale=0.7
        incremental:     true
        link-citations:  true
        citecolor:       blue
        hyperrefoptions:
            - pdfstartview=Fit
## Home-brewed LaTeX macros
        include-in-header:
            - "PerfectEpidemics.sty"

## Control of cache
execute:
    cache: true

