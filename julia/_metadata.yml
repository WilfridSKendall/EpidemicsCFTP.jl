## YAML to be shared amongst all scripts in this directory.
## Allow {==...==} to indicate highlight, etc
filters:
  - critic-markup

## Bibligraphy style
csl:                /home/wilfrid/lib/palndoc/CSL/ima-journal-of-applied-mathematics.csl

## Allow for \(...\) and \[..\]
from:               markdown+tex_math_single_backslash

## Table of contents
toc:                true

## Date format
date-format:        "D MMMM YYYY"

## Location of table legends
tbl-cap-location:   top

## Specifics of PDF format
format:
  pdf:
    papersize:      a4
    link-citations: true
    numbersections: true
    mainfont:       "Times New Roman"
    monofont:       "JuliaMono"
    monofontoptions:
       - Scale=0.7

## Control of cache
execute:
    cache: true
