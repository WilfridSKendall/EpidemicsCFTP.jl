# Note the need to quote strings! I'd much prefer an alternative to this ...
# Probably would need to understand the Tk.Canvas itemconfig method better.

[text]
anchor: tk.N
font: ("Times", 12, "bold")

[timeline]
width: 2
fill: "purple"

[frame]
fill: "grey50"

[potential_removal]
foreground: "blue"

[removal]
foreground: "red"

[potential_infection]
width: 6
fill: "palegreen"
arrow: tk.LAST
arrowshape: (8, 20, 12)

[infection_incident]
outline: "yellow"
width: 2

[infectious]
width: 6
fill: "yellow"

[epidemic]
width: 2
fill: "red"
