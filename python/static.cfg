# Note the need to quote strings! I'd much prefer an alternative to this ...
# Probably would need to understand the Tk.Canvas itemconfig method better.

[text]
anchor: n
font: Times 12 bold

[timeline]
width: 2
fill: purple

[frame]
fill: grey50

[Infect-P]
width: 6
fill: palegreen
arrow: last
arrowshape: 8 20 12

[Infect]
outline: orange
width: 4
fill: yellow

[Infectious]
width: 6
fill: yellow

[Epidemic]
width: 2
fill: red

[Remove-P]
foreground: blue

[Remove]
foreground: red

