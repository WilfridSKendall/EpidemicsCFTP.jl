[0-xlabel]
anchor: n
font: Times 12 bold

[0-ylabel]
anchor: w
font: Times 12 bold

[0-timeline]
width: 2
fill: purple

[0-frame]
fill: grey50

[0-base]
fill: white

[0-button]
font: Times 12 bold
width: 15            

[11-pI-lo] ; putative infection circumstances (thin pale green arrow, running from putative infecting row to row that would be infected).
#
# For this infection actually to happen, the putative infecting row must be infected at the time of the
# infection, and the row to be infected must be the lowest row susceptible at time of infection.
width: 1
fill: pale green
arrow: last
arrowshape: 8 20 12

[12-lI] ; locates latent infection (as a yellow circle with orange boundary on row that would be infected).
outline: orange
width: 4
fill: yellow

[12-lIc] ; latent infection circumstances (thin dark green arrow, running from latent previously highest infected to new latent highest infected).
#
# For this infection actually to happen, the putative infecting row must be infected at the time of the
# infection, and the row to be infected must be the lowest row susceptible at time of infection.
width: 1
fill: dark green
arrow: last
arrowshape: 8 20 12

[12-aI] ; activated infection (thick dark green arrow, running from previously highest infected to new highest infected).
#
# For this infection actually to happen, the putative infecting row must be infected at the time of the
# infection, and the row to be infected must be the lowest row susceptible at time of infection.
width: 4
fill: yellow
arrow: last
arrowshape: 8 20 12

[12-Infectious] ; portions of rows that are infected (yellow lines).
width: 6
fill: yellow

[12-Epidemic] ; traces most recently infected individual that is currently infected (as a thin red line).
width: 2
fill: red

[11-pR] ; putative removal (blue no-way sign).
#
# For this removal actually to take effect, the row on which it sits must be infected at the relevant time.
# The lowest row currently infected will then suffer a removal.
foreground: blue

[12-R] ; implemented removal (red no-way sign).
#
# This sits on the lowest row currently infected, which then suffers a removal;
# it sits below the corresponding potential removal. Note that sometimes potential and
# implemented removals coincide, in which case in the initial configuration of `static.py`
# only the implemented removal is visible.
foreground: red

[12-Mordor] ; to avoid premature removal, these black portions of rows should not be infected.
width: 6
fill: black

[12-nofly] ; to avoid premature removal, these grey portions of rows should not be infected.
width: 6
fill: grey50
